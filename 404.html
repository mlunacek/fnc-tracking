<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
        // GitHub Pages SPA redirect
        const repo = "/fnc-tracking";
        const path = window.location.pathname.replace(repo, "");
        window.location.replace(repo + "/?p=" + path + window.location.search + window.location.hash);
    </script>
</head>

<body></body>

</html>

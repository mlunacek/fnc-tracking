<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fnc-tracking</title>
  <script type="module" crossorigin src="/fnc-tracking/assets/index-VMBahM_J.js"></script>
</head>

<body>
  <div id="root"></div>
  <script>
    (function () {
      var l = window.location;
      if (l.search.startsWith("?/")) {
        // Convert /?/<path>&a=b back into /<path>?a=b
        var query = l.search.slice(2); // remove "?/"
        var parts = query.split("&");
        var path = parts.shift();      // first part is the path
        var rest = parts.length ? "?" + parts.join("&") : "";
        l.replace(l.pathname.replace(/\/$/, "") + "/" + path + rest + l.hash);
      }
    })();
  </script>
</body>

</html>
